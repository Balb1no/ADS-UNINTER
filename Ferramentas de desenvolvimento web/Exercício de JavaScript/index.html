<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- O local onde o número será exibido -->
    <div id="container-contador">
        <h1>Contador: <span id="valor-contador">0</span></h1>

        <!-- Botão para zerar -->
        <button id="btn-zerar">Zerar</button>
    </div>

    <!-- Importante: Chamando o arquivo JavaScript no final do body -->
    <script src="script.js"></script>
</body>

</html>
